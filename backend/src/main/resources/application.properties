# ShopEase backend — Spring Boot configuration
# The server listens on this port; hit http://localhost:8080/api/products
server.port=8080

spring.application.name=shopease-server

# NOTE: the database connection is NOT configured here. The DAO layer
# (com.shopease.db.DBConnection) reads its own credentials from
# db.properties on the classpath (src/main/resources/db.properties),
# exactly as it did in the standalone ShopEase-db project. This keeps the
# tested DAO code unchanged. If you later switch to a Spring-managed
# DataSource + connection pool, move those values to spring.datasource.*
# here and inject a DataSource into the DAOs instead.
