
spring.application.name=ShopEase
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Load the project-root .env file
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.cache=false

# Helpful during development
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}

# Override these with environment variables in production.
shopease.admin.email=${SHOPEASE_ADMIN_EMAIL}
shopease.admin.password=${SHOPEASE_ADMIN_PASSWORD}

# SMTP is required for password sign-in verification codes.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
shopease.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@shopease.local}}

# Google OAuth 2.0 credentials (Google Cloud Console, Web application client).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-login-not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-login-not-configured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Product images uploaded from seller/admin forms
shopease.upload-dir=${SHOPEASE_UPLOAD_DIR:uploads/products}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
