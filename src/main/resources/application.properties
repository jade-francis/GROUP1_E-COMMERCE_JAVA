
spring.application.name=ShopEase
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Load the project-root .env file
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.cache=false

# Helpful during development
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}

# Override these with environment variables in production.
shopease.admin.email=${SHOPEASE_ADMIN_EMAIL}
shopease.admin.password=${SHOPEASE_ADMIN_PASSWORD}

# Product images uploaded from seller/admin forms
shopease.upload-dir=${SHOPEASE_UPLOAD_DIR:uploads/products}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
