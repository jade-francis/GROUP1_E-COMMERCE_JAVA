<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Product' : 'Add New Product'">Product Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <header class="page-header">
        <h1 th:text="${isEdit} ? 'Edit Product' : 'Add New Product'">Product Form</h1>
        <p class="subtitle" th:text="${isEdit} ? 'Update product details' : 'Create a new product for your store'">Form</p>
    </header>

    <div th:if="${success}" class="alert alert-success" th:text="${success}">Success message</div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}">Error message</div>

    <div class="profile-card" style="max-width: 700px;">
        <form th:action="${isEdit} ? @{/seller/products/{id}(id=${product.id})} : @{/seller/products}" method="post" enctype="multipart/form-data" th:object="${product}" class="profile-form">
            
            <div class="form-group">
                <label for="name">Product Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" th:field="*{name}" required maxlength="150" 
                       placeholder="Enter product name">
                <div th:if="${#fields.hasErrors('name')}" class="field-error" th:errors="*{name}">Error</div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" th:field="*{description}" rows="4" 
                          placeholder="Describe your product"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label for="price">Price (NGN) <span class="required">*</span></label>
                    <input type="number" id="price" name="price" th:field="*{price}" 
                           step="0.01" min="0" required placeholder="0.00">
                    <div th:if="${#fields.hasErrors('price')}" class="field-error" th:errors="*{price}">Error</div>
                </div>

                <div class="form-group">
                    <label for="stockQuantity">Stock Quantity <span class="required">*</span></label>
                    <input type="number" id="stockQuantity" name="stockQuantity" th:field="*{stockQuantity}" 
                           min="0" required placeholder="0">
                    <div th:if="${#fields.hasErrors('stockQuantity')}" class="field-error" th:errors="*{stockQuantity}">Error</div>
                </div>
            </div>

            <div class="form-group">
                <label for="categoryId">Category</label>
                <select id="categoryId" name="categoryId" th:field="*{categoryId}">
                    <option value="">Select category (optional)</option>
                    <option th:each="cat : ${categories}" 
                            th:value="${cat.id()}" 
                            th:text="${cat.name()}"
                            th:selected="${cat.id() == product.categoryId}">Category</option>
                </select>
            </div>

            <div class="form-group">
                <label for="imageUrl">Image URL</label>
                <input type="url" id="imageUrl" name="imageUrl" th:field="*{imageUrl}" 
                       placeholder="https://example.com/image.jpg">
                <small class="form-hint">Leave blank to use placeholder image</small>
            </div>

            <div class="form-group">
                <label for="imageFile">Or upload an image</label>
                <input type="file" id="imageFile" name="imageFile" accept="image/jpeg,image/png,image/webp,image/gif">
                <small class="form-hint">Uploading a file takes priority over the image URL (maximum 8 MB).</small>
            </div>

            <div class="image-preview-wrap">
                <span class="form-hint">Image preview</span>
                <img id="imagePreview" class="product-image-preview"
                     th:src="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl) ? product.imageUrl : '/images/placeholder.svg'}"
                     alt="Product image preview" onerror="this.onerror=null;this.src='/images/placeholder.svg'">
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid #e5e7eb;">
                <a th:href="@{/seller/products}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Update Product' : 'Create Product'">Submit</button>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/js/product-image-form.js}"></script>

<div th:replace="~{fragments/navbar :: footer}"></div>
</body>
</html>
