<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - Seller Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <header class="page-header">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1>My Products</h1>
                <p class="subtitle">Manage your product catalog</p>
            </div>
            <a th:href="@{/seller/products/new}" class="btn btn-primary">Add New Product</a>
        </div>
    </header>

    <div th:if="${success}" class="alert alert-success" th:text="${success}">Success message</div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}">Error message</div>

    <div class="profile-card">
        <div th:if="${products.isEmpty()}" class="empty-state" style="text-align: center; padding: 48px 24px;">
            <h3>No products yet</h3>
            <p style="color: #6b7280; margin-bottom: 24px;">Start by adding your first product to the store.</p>
            <a th:href="@{/seller/products/new}" class="btn btn-primary">Add First Product</a>
        </div>

        <div th:unless="${products.isEmpty()}">
            <div style="overflow-x: auto;">
                <table class="admin-sellers-table">
                    <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product : ${products}">
                        <td>
                            <img th:src="${product.imageUrl}" alt="Product" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;">
                        </td>
                        <td>
                            <strong th:text="${product.name}">Product Name</strong>
                            <br>
                            <small style="color: #6b7280;" th:text="${product.description}">Description</small>
                        </td>
                        <td>
                            <span th:text="${product.categoryId != null ? categoryNames.get(product.categoryId) : 'Uncategorized'}">Category</span>
                        </td>
                        <td>
                            <strong th:text="'₦' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">₦0.00</strong>
                        </td>
                        <td>
                            <span th:class="${product.stockQuantity == 0 ? 'status-badge suspended' : (product.stockQuantity < 10 ? 'status-badge pending' : 'status-badge approved')}" 
                                  th:text="${product.stockQuantity + ' in stock'}">In Stock</span>
                        </td>
                        <td>
                            <a th:href="@{/seller/products/{id}/edit(id=${product.id})}" class="btn btn-secondary btn-sm">Edit</a>
                            <form th:action="@{/seller/products/{id}/delete(id=${product.id})}" method="post" style="display: inline; margin-left: 8px;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this product? This cannot be undone.')">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/navbar :: footer}"></div>
</body>
</html>
