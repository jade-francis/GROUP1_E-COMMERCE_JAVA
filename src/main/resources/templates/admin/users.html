<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manage Users - ShopEase</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><header class="page-header page-header-row"><div><h1>Manage Users</h1><p class="subtitle">Buyers, sellers and account status</p></div><a th:href="@{/admin}" class="btn btn-secondary btn-sm">Dashboard</a></header>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-error" th:text="${error}"></div><section class="profile-card table-card"><div class="table-scroll"><table class="admin-sellers-table"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Seller status</th><th>Joined</th><th></th></tr></thead><tbody><tr th:each="user : ${users}"><td th:text="${user.id}">1</td><td th:text="${user.name}">User</td><td th:text="${user.email}">email</td><td><span class="role-badge" th:classappend="${user.role.toLowerCase()}" th:text="${user.role}">CUSTOMER</span></td><td th:text="${user.sellerStatus}">NOT_SELLER</td><td th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy')}">Date</td><td><form th:if="${user.role != 'ADMIN'}" th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post"><button class="btn btn-danger btn-sm" type="submit" onclick="return confirm('Remove this user?')">Remove</button></form></td></tr></tbody></table></div></section></main><div th:replace="~{fragments/navbar :: footer}"></div></body></html>
