<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Products - ShopEase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <header class="page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <h1>Admin: Manage Products</h1>
        <div style="display: flex; gap: 12px;">
            <a th:href="@{/admin}" class="btn btn-secondary btn-sm">Back to Dashboard</a>
            <a th:href="@{/admin/products/new}" class="btn btn-primary">Add New Product</a>
        </div>
    </header>

    <div class="profile-card">
        <div th:if="${products.isEmpty()}" class="empty-state">
            <p>No products yet.</p>
        </div>

        <div th:unless="${products.isEmpty()}">
            <table class="admin-sellers-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Seller</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td th:text="${product.name}">Product Name</td>
                    <td th:text="'₦' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">₦0.00</td>
                    <td th:text="${product.stockQuantity}">0</td>
                    <td th:text="${product.sellerId != null ? product.sellerId : 'Store'}">Store</td>
                    <td>
                        <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-secondary btn-sm">Edit</a>
                        <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" style="display: inline; margin-left: 8px;">
                            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete this product?')">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/navbar :: footer}"></div>
</body>
</html>
