<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - ShopEase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <header class="page-header">
        <h1>Products</h1>
    </header>

    <div class="products-layout">
        <aside class="sidebar">
            <h3>Categories</h3>
            <ul class="category-list">
                <li>
                    <a th:href="@{/products}" th:class="${selectedCategoryId == null} ? 'active' : ''">All Products</a>
                </li>
                <li>
                    <a th:href="@{/products(categoryId=1)}" th:class="${selectedCategoryId == 1} ? 'active' : ''">Electronics</a>
                </li>
                <li>
                    <a th:href="@{/products(categoryId=2)}" th:class="${selectedCategoryId == 2} ? 'active' : ''">Fashion</a>
                </li>
                <li>
                    <a th:href="@{/products(categoryId=3)}" th:class="${selectedCategoryId == 3} ? 'active' : ''">Home & Living</a>
                </li>
            </ul>
        </aside>

        <section class="products-grid">
            <div th:if="${products.isEmpty()}" class="empty-state">
                <p>No products found.</p>
            </div>
            <div th:each="product : ${products}" class="product-card">
                <div class="product-image">
                    <img th:src="${product.imageUrl ?: '/images/placeholder.svg'}" th:alt="${product.name}" onerror="this.onerror=null;this.src='/images/placeholder.svg'">
                </div>
                <div class="product-info">
                    <h3 th:text="${product.name}">Product Name</h3>
                    <p class="product-price" th:text="'₦' + ${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">₦0.00</p>
                    <p class="product-stock" th:text="${product.stockQuantity} + ' in stock'">In stock</p>
                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </section>
    </div>
</div>

<div th:replace="~{fragments/navbar :: footer}"></div>
</body>
</html>
