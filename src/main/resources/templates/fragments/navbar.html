<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group 1 Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar" th:fragment="navbar">
    <div class="navbar-container">
        <a class="navbar-brand" th:href="@{/}">
            Group 1 Store
        </a>

        <ul class="navbar-nav">
            <li><a th:href="@{/}" class="nav-link">Home</a></li>
            <li><a th:href="@{/products}" class="nav-link">Products</a></li>
            <li><a th:href="@{/cart}" class="nav-link">Cart</a></li>

            <li sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="nav-link">Login</a>
            </li>
            <li sec:authorize="!isAuthenticated()">
                <a th:href="@{/register}" class="nav-link btn btn-primary">Register</a>
            </li>

            <!-- Authenticated user dropdown -->
            <li sec:authorize="isAuthenticated()" class="navbar-user">
                <a class="navbar-user-btn" href="#">
                    <span class="navbar-user-avatar" th:text="${#authentication.name.substring(0,1).toUpperCase()}">U</span>
                    <span sec:authentication="name"></span>
                </a>
                <div class="navbar-user-dropdown">
                    <div class="navbar-user-dropdown-header">
                        <div class="navbar-user-dropdown-name" sec:authentication="name"></div>
                        <div class="navbar-user-dropdown-email" sec:authentication="name"></div>
                    </div>
                    <div class="navbar-user-dropdown-divider"></div>
                    <a th:href="@{/profile}" class="navbar-user-dropdown-item">Profile</a>
                    
                    <!-- Seller-related links based on role/status -->
                    <a sec:authorize="hasRole('SELLER')" 
                       th:href="@{/seller/dashboard}" th:if="${currentUser != null and currentUser.sellerStatus == 'APPROVED'}" class="navbar-user-dropdown-item">
                        Seller Dashboard
                    </a>
                    <a sec:authorize="hasRole('SELLER')" class="navbar-user-dropdown-item disabled" th:if="${currentUser != null and currentUser.sellerStatus == 'PENDING'}">
                        Seller Dashboard <span class="navbar-user-dropdown-badge pending">Pending</span>
                    </a>
                    <a sec:authorize="hasRole('CUSTOMER') and !hasRole('SELLER')" 
                       th:href="@{/seller/request}" class="navbar-user-dropdown-item">
                        Become a Seller
                    </a>
                    <a sec:authorize="hasRole('SELLER')" class="navbar-user-dropdown-item disabled" th:if="${currentUser != null and currentUser.sellerStatus == 'SUSPENDED'}">
                        Seller Access Suspended
                    </a>
                    
                    <div class="navbar-user-dropdown-divider"></div>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/sellers}" class="navbar-user-dropdown-item">
                        Admin: Manage Sellers
                    </a>
                    
                    <div class="navbar-user-dropdown-divider"></div>
                    <form th:action="@{/logout}" method="post" style="margin: 0;">
                        <button type="submit" class="navbar-user-dropdown-item" style="width: 100%; text-align: left; border: none; background: none; font: inherit; cursor: pointer; padding: 10px 16px; color: #344054; font-size: 14px;">
                            Logout
                        </button>
                    </form>
                </div>
            </li>
        </ul>
    </div>
</nav>

<footer class="footer" th:fragment="footer">
    <div class="footer-container">
        <p>&copy; 2026 Group 1 Store. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
