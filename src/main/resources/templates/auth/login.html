<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopEase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="auth-page">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your account</p>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div th:if="${passwordReset}" class="alert alert-success">Your password has been changed. You can sign in now.</div>
            <div th:if="${param.error}" class="error-message">
                Invalid email or password
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" th:value="${param.email}">
            </div>

            <div class="form-group">
                <div class="form-label-row"><label for="password">Password</label><a th:href="@{/forgot-password}">Forgot password?</a></div>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Sign In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a th:href="@{/register}">Create one</a>
        </p>
    </div>
</main>

<div th:replace="~{fragments/navbar :: footer}"></div>
</body>
</html>
