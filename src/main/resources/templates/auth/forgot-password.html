<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Forgot Password - ShopEase</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><div class="auth-page">
    <div class="auth-brand-mark">SE</div><h1>Reset your password</h1><p class="subtitle">Enter your account email to create a secure reset link.</p>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${resetToken}" class="dev-reset-link"><strong>Your password reset token</strong><code th:text="${resetToken}"></code><a th:href="${resetUrl}">Continue to reset password</a><small>This token expires in 30 minutes and can only be used once.</small></div>
    <form th:action="@{/forgot-password}" method="post"><div class="form-group"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email"></div><button class="btn btn-primary btn-lg btn-block" type="submit">Create reset link</button></form>
    <p class="auth-footer"><a th:href="@{/login}">Back to sign in</a></p>
</div></main><div th:replace="~{fragments/navbar :: footer}"></div></body></html>
