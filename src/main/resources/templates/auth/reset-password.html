<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose New Password - ShopEase</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container"><div class="auth-page">
    <div class="auth-brand-mark">SE</div><h1>Choose a new password</h1><p class="subtitle">Use at least 8 characters.</p>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:unless="${validToken}" class="alert alert-error">This reset link is invalid or has expired. <a th:href="@{/forgot-password}">Request another link</a>.</div>
    <form th:if="${validToken}" th:action="@{/reset-password}" method="post"><input type="hidden" name="token" th:value="${token}"><div class="form-group"><label for="password">New password</label><input id="password" name="password" type="password" minlength="8" maxlength="100" required autocomplete="new-password"></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="100" required autocomplete="new-password"></div><button class="btn btn-primary btn-lg btn-block" type="submit">Update password</button></form>
</div></main><div th:replace="~{fragments/navbar :: footer}"></div></body></html>
