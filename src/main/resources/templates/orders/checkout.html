<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopEase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <header class="page-header">
        <h1>Checkout</h1>
    </header>

    <div th:if="${requiresLogin}" class="auth-page" style="max-width: 600px;">
        <div class="empty-state">
            <h2>Login Required</h2>
            <p>Please log in to complete your purchase.</p>
            <a th:href="@{/login}" class="btn btn-primary">Sign In</a>
            <a th:href="@{/register}" class="btn btn-secondary" style="margin-left: 12px;">Create Account</a>
        </div>
    </div>

    <div th:unless="${requiresLogin}">
        <div class="checkout-layout">
            <section class="checkout-form-section">
                <h2>Shipping Address</h2>

                <div th:if="${error}" class="error-message" style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 16px; border-radius: 8px; margin-bottom: 24px;">
                    <span th:text="${error}">Error</span>
                </div>

                <form th:action="@{/checkout}" method="post">
                    <div class="form-group">
                        <label for="shippingAddress">Full Shipping Address</label>
                        <textarea id="shippingAddress" name="shippingAddress" rows="4" required
                                  placeholder="Street address, city, state, ZIP code, country"
                                  style="width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; font-family: inherit; resize: vertical;"></textarea>
                        <small style="color: #6b7280; margin-top: 4px; display: block;">We'll ship your order to this address</small>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 24px;"
                            th:disabled="${cartItems == null or cartItems.isEmpty()}">
                        Place Order
                    </button>
                </form>
            </section>

            <aside class="checkout-summary">
                <h3>Order Summary</h3>
                <div th:if="${cartItems != null and not cartItems.isEmpty()}">
                    <div th:each="item : ${cartItems}" class="checkout-summary-row" style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #e5e7eb;">
                        <span th:text="${item.productName} + ' × ' + ${item.quantity}"></span>
                        <span th:text="'$' + ${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}"></span>
                    </div>
                    <div class="checkout-summary-row total" style="font-weight: 700; font-size: 18px; color: #172033; padding-top: 16px; border-top: 1px solid #e5e7eb;">
                        <span>Total</span>
                        <span th:text="'$' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></span>
                    </div>
                </div>
                <div th:unless="${cartItems != null and not cartItems.isEmpty()}" class="empty-state" style="padding: 24px; text-align: center;">
                    <p>Your cart is empty</p>
                    <a th:href="@{/products}" class="btn btn-primary">Continue Shopping</a>
                </div>
            </aside>
        </div>
    </div>
</main>

<div th:replace="~{fragments/navbar :: footer}"></div>
</body>
</html>
