name: shopease
region: fra
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPOSITORY
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
    envs:
      - key: DB_URL
        scope: RUN_TIME
        type: SECRET
      - key: DB_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: SHOPEASE_ADMIN_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: SHOPEASE_ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: SERVER_ERROR_INCLUDE_MESSAGE
        scope: RUN_TIME
        value: never
      - key: SPACES_ENDPOINT
        scope: RUN_TIME
      - key: SPACES_REGION
        scope: RUN_TIME
      - key: SPACES_BUCKET
        scope: RUN_TIME
      - key: SPACES_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_PUBLIC_URL
        scope: RUN_TIME
